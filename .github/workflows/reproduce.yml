name: Fixed-seed reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned numerical and image dependencies
        run: python -m pip install -r requirements.txt
      - name: Install optional CJK font (bounded)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Font pixels are not a numerical acceptance criterion. A slow mirror
          # must not prevent the reference and regeneration checks below.
          timeout 75s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-noto-cjk
      - name: Validate published reference artifacts
        run: python verify.py
      - name: Recompute the fixed-seed experiment
        run: python reproduce.py
      - name: Compare regenerated data with reference
        run: python verify.py --reproduced
