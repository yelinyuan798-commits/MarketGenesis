name: Fixed-seed reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies and CJK font
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Validate published reference artifacts
        run: python verify.py
      - name: Recompute the fixed-seed experiment
        run: python reproduce.py
      - name: Compare regenerated data with reference
        run: python verify.py --reproduced
